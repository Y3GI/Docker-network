services:
  # Router / Firewall / IDS
  rtr:
    image: alpine:3.20
    container_name: rtr
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
    sysctls:
      net.ipv4.ip_forward: 1
    volumes:
      - ./suricata:/etc/suricata:ro
      - ./logs/suricata:/var/log/suricata
      - ./nftables.conf:/etc/nftables.conf:ro
    command: >
      /bin/sh -c "
      apk add --no-cache nftables suricata tcpdump iproute2;
      sysctl -w net.ipv4.ip_forward=1;
      echo 'Loading nftables rules...';
      nft flush ruleset;
      nft -f /etc/nftables.conf;
      echo 'Starting Suricata IDS...';
      rm -f /var/run/suricata.pid;
      suricata -c /etc/suricata/suricata.yaml -i eth1 -i eth2 -D;
      tail -f /var/log/suricata/suricata.log"
    networks:
      wan_net:
        ipv4_address: 172.99.168.152
      dmz_net:
        ipv4_address: 172.10.168.152
      internal_net:
        ipv4_address: 172.40.168.152

  # CoreDNS Server
  dns:
    image: coredns/coredns:latest
    container_name: dns
    cap_add:
      - NET_ADMIN
    networks:
      dmz_net:
        ipv4_address: 172.10.0.200
      internal_net:
        ipv4_address: 172.40.0.200
    volumes:
      - ./Corefile:/Corefile:ro
    command: /bin/sh -c "ip route add 172.10.0.0/16 via 172.40.168.152 && /coredns -conf /Corefile"

  # DMZ reverse proxy (Traefik)
  proxy:
    image: traefik:v3.1
    container_name: proxy
    cap_add:
      - NET_ADMIN
    ports:
      - "8880:80"
      - "8443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    dns:
      - 172.10.0.200
    networks:
      dmz_net:
        aliases:
          - proxy.dmz
    depends_on:
      - app_public
    command: /bin/sh -c "ip route add 172.40.0.0/16 via 172.10.168.152 && traefik --api.insecure=true --providers.docker=true --entrypoints.web.address=:80 --entrypoints.websecure.address=:443"

  # Public App (Apache)
  app_public:
    image: httpd:latest
    container_name: app_public
    cap_add:
      - NET_ADMIN
    networks:
      dmz_net:
        aliases:
          - app.dmz
    dns:
      - 172.10.0.200
    volumes:
      - ./html:/usr/local/apache2/htdocs:ro
    command: /bin/sh -c "ip route add 172.40.0.0/16 via 172.10.168.152 && httpd-foreground"

  # Internal App (Nginx)
  app_internal:
    image: nginx:alpine
    container_name: app_internal
    cap_add:
      - NET_ADMIN
    networks:
      internal_net:
        aliases:
          - app.internal
    dns:
      - 172.40.0.200
    command: /bin/sh -c "ip route add 172.10.0.0/16 via 172.40.168.152 && nginx -g 'daemon off;'"

  # WireGuard VPN
  vpn:
    image: linuxserver/wireguard
    container_name: vpn
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Amsterdam
      - SERVERURL=auto
      - SERVERPORT=51820
      - PEERS=alice
      - PEERDNS=1.1.1.1
      - INTERNAL_SUBNET=172.20.0.0/16
    volumes:
      - ./wg:/config
    dns:
      - 172.40.0.200
    networks:
      - wan_net
      - internal_net

  # === MONITORING STACK (Cleaned up!) ===
  wazuh.manager:
    image: wazuh/wazuh-manager:4.9.1
    container_name: wazuh.manager
    networks:
      internal_net:
        aliases:
          - wazuh.internal
    ports:
      - "1514:1514/udp"
      - "1515:1515"
    environment:
      - WAZUH_LOGLEVEL=info
      - DISABLE_FILEBEAT=true
    volumes:
      - ./wazuh_config:/var/ossec/etc
      - ./logs:/var/log/suricata:ro
      - ./logs/wazuh:/var/log/wazuh
      - ./logs/wazuh:/var/ossec/logs
      - ./disable-filebeat:/etc/services.d/filebeat
    dns:
      - 172.40.0.200

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    networks:
      internal_net:
        aliases:
          - prometheus.internal
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    dns:
      - 172.40.0.200

  loki:
    image: grafana/loki:2.9.8
    container_name: loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      internal_net:
        aliases:
          - loki.internal
    ports:
      - "3100:3100"
    dns:
      - 172.40.0.200

  promtail:
    image: grafana/promtail:2.9.8
    container_name: promtail
    ports:
      - "9080:9080"
    volumes:
      - ./logs/wazuh:/var/log/wazuh:ro
      - ./promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    networks:
      internal_net:
        aliases:
          - promtail.internal
    dns:
      - 172.40.0.200
    labels:
      - "traefik.enable=false"

  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana
    depends_on:
      - prometheus
      - loki
    networks:
      internal_net:
        aliases:
          - grafana.internal
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    dns:
      - 172.40.0.200

volumes:
  grafana_data:

networks:
  wan_net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: "172.99.0.0/16"
          gateway: 172.99.0.1
  dmz_net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: "172.10.0.0/16"
          gateway: 172.10.0.1
  internal_net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: "172.40.0.0/16"
          gateway: 172.40.0.1